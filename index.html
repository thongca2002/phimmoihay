<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Phim Tổng Hợp</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Thanh chọn danh mục Phim */
    .tabs {
      display: flex;
      justify-content: center;
      background: #181818;
      padding: 10px 0;
      border-bottom: 1px solid #282828;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #aaa;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      color: #e50914;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.3);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 8px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      /* Giới hạn tên phim trong 2 dòng để giao diện đều nhau */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
    }

    .detail {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 10px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .btn {
      background: #e50914;
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-top: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover { background: #b80710; }
  </style>
</head>

<body>

<header>🎬 PHIM MỚI MỖI NGÀY</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('movie/popular', this)">Phim Lẻ Hot</button>
  <button class="tab-btn" onclick="switchCategory('tv/popular', this)">Phim Bộ (TV Show)</button>
  <button class="tab-btn" onclick="switchCategory('movie/now_playing', this)">Phim Chiếu Rạp</button>
</div>

<div id="list" class="grid"></div>

<div id="detail" class="detail"></div>

<script>
// Giữ nguyên Khóa API Key v3 của bạn
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
const IMG = "https://image.tmdb.org/t/p/w500";

let currentEndpoint = "movie/popular"; // Mặc định khi vào trang sẽ tải phim lẻ hot

// ===== TẢI DỮ LIỆU THEO DANH MỤC =====
async function loadMovies(endpoint){
  try {
    let res = await fetch(`https://api.themoviedb.org/3/${endpoint}?api_key=${TMDB_KEY}&language=vi-VN&page=1`);
    let data = await res.json();
    
    // Lưu ý: Phim bộ dùng trường 'name', phim lẻ dùng trường 'title'
    show(data.results, endpoint.startsWith('tv'));
  } catch (error) {
    console.error("Lỗi kết nối API:", error);
  }
}

// ===== HIỂN THỊ DANH SÁCH RA MÀN HÌNH =====
function show(movies, isTVSeries){
  let html = "";
  movies.forEach(m => {
    let poster = m.poster_path ? (IMG + m.poster_path) : 'https://placehold.co/500x750?text=No+Image';
    let title = isTVSeries ? m.name : m.title; // Lấy đúng tên phim tùy thể loại
    
    // Truyền thêm cờ dữ liệu để biết khi nhấn vào là phim bộ hay phim lẻ
    html += `
      <div class="card" onclick="detail(${m.id}, ${isTVSeries})">
        <img src="${poster}">
        <p>${title}</p>
      </div>
    `;
  });
  document.getElementById("list").innerHTML = html;
}

// ===== CHUYỂN ĐỔI QUA LẠI GIỮA CÁC TAB =====
function switchCategory(endpoint, buttonElement) {
  // Xóa class active ở nút cũ, thêm vào nút mới bấm
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  buttonElement.classList.add('active');
  
  // Reset lại giao diện danh sách
  backToList();
  currentEndpoint = endpoint;
  loadMovies(endpoint);
}

// ===== CHI TIẾT & TRÌNH PHÁT VIDEO =====
async function detail(id, isTVSeries){
  try {
    // Xác định xem cần lấy thông tin chi tiết phim bộ (tv) hay phim lẻ (movie)
    let type = isTVSeries ? 'tv' : 'movie';
    let res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&language=vi-VN`);
    let m = await res.json();

    document.getElementById("list").style.display = "none";
    document.getElementById("tabContainer").style.display = "none"; // Ẩn thanh tab khi đang xem phim
    document.getElementById("detail").style.display = "block";

    let title = isTVSeries ? m.name : m.title;
    
    // Cấu hình đường dẫn nhúng tương ứng cho Phim lẻ (movie) hoặc Phim bộ (tv)
    let embedUrl = isTVSeries 
      ? `https://vidsrc.me/embed/tv?id=${id}&season=1&episode=1` // Mặc định tập 1 mùa 1 cho phim bộ
      : `https://vidsrc.me/embed/movie/${id}`;

    document.getElementById("detail").innerHTML = `
      <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
      <h2>${title}</h2>
      
      <div class="video-container">
        <iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
      </div>

      ${isTVSeries ? '<p style="color: #e50914; font-size: 14px; margin-top:10px;">💡 Đối với phim bộ, bạn có thể chọn tập/mùa trực tiếp bên trong trình phát video (Nút Select Episode).</p>' : ''}

      <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung:</strong> ${m.overview || "Chưa có nội dung tóm tắt tiếng Việt."}</p>
    `;
  } catch (error) {
    console.error("Lỗi tải phim:", error);
  }
}

// ===== QUAY LẠI =====
function backToList() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("list").style.display = "grid";
  document.getElementById("tabContainer").style.display = "flex";
  document.getElementById("detail").innerHTML = ""; // Xóa iframe cũ
}

// Khởi chạy ứng dụng lần đầu tiên
loadMovies(currentEndpoint);

</script>

</body>
</html>

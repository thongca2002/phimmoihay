<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Phim Mới</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#111;
  color:white;
}

header{
  background:#000;
  padding:15px;
  display:flex;
  gap:10px;
}

header a{
  color:white;
  text-decoration:none;
  padding:8px 12px;
  background:#222;
  border-radius:6px;
}

header a:hover{
  background:red;
}

h2{
  padding:15px;
}

.container{
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
}

.movie{
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.movie img{
  width:100%;
  height:240px;
  object-fit:cover;
}

.movie .title{
  padding:8px;
  font-size:14px;
}
</style>

</head>

<body>

<header>
  <a href="index.html">Trang chủ</a>
  <a href="phim-le.html">Phim lẻ</a>
  <a href="phim-bo.html">Phim bộ</a>
</header>

<h2>🔥 Phim mới cập nhật</h2>

<div class="container" id="movies"></div>

<script>
// 🔥 API KEY CỦA BẠN (TMDB)
const API_KEY = "e21a85e6xxxxxxx"; // <-- thay đúng key của bạn

const API_URL =
`https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=vi-VN`;

async function loadMovies(){
  try{
    const res = await fetch(API_URL);
    const data = await res.json();

    const list = document.getElementById("movies");
    list.innerHTML = "";

    data.results.forEach(movie=>{
      list.innerHTML += `
        <div class="movie">
          <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}">
          <div class="title">${movie.title}</div>
        </div>
      `;
    });

  }catch(err){
    console.log(err);
    document.getElementById("movies").innerHTML =
    "❌ Không tải được phim";
  }
}

loadMovies();
</script>

</body>
</html>

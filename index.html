<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phim Mới Fix - Dùng API Key v3</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 8px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
    }

    .detail {
      display: none;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 10px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .btn {
      background: #e50914;
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-top: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>🎬 PHIM MỚI CỦA TÔI</header>

<div id="list" class="grid"></div>

<div id="detail" class="detail"></div>

<script>
// Đã điền sẵn khóa API Key v3 của bạn ở đây
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
const IMG = "https://image.tmdb.org/t/p/w500";

// ===== LOAD PHIM MỚI =====
async function loadMovies(){
  try {
    // Khi dùng API v3, ta truyền trực tiếp vào URL dạng ?api_key=...
    let res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_KEY}&language=vi-VN&page=1`);
    let data = await res.json();
    show(data.results);
  } catch (error) {
    console.error("Lỗi tải danh sách:", error);
  }
}

// ===== HIỂN THỊ =====
function show(movies){
  let html = "";
  movies.forEach(m => {
    let poster = m.poster_path ? (IMG + m.poster_path) : 'https://placehold.co/500x750?text=No+Image';
    html += `
      <div class="card" onclick="detail(${m.id})">
        <img src="${poster}">
        <p>${m.title}</p>
      </div>
    `;
  });
  document.getElementById("list").innerHTML = html;
}

// ===== TRANG XEM PHIM =====
async function detail(id){
  try {
    let res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_KEY}&language=vi-VN`);
    let m = await res.json();

    document.getElementById("list").style.style.display = "none";
    document.getElementById("detail").style.display = "block";

    // Nhúng link vidsrc để lấy video phim tự động từ ID
    let embedUrl = `https://vidsrc.me/embed/movie/${id}`;

    document.getElementById("detail").innerHTML = `
      <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
      <h2>${m.title}</h2>
      
      <div class="video-container">
        <iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
      </div>

      <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung:</strong> ${m.overview || "Chưa có nội dung tóm tắt tiếng Việt."}</p>
    `;
  } catch (error) {
    console.error("Lỗi tải chi tiết:", error);
  }
}

// ===== QUAY LẠI =====
function backToList() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("list").style.display = "grid";
  document.getElementById("detail").innerHTML = ""; // Tắt hẳn phim cũ để tránh âm thanh chạy ngầm
}

// Chạy ứng dụng
loadMovies();

</script>

</body>
</html>

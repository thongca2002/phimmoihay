<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="google-site-verification" content="_qvRq2uxGuWnTbVkf-P-UYKSRb_qnPltxTEA6by4Gfk" />
  
  <title>PHIM MỚI - Xem Phim Online Hay Miễn Phí Mới Nhất</title>
  <meta name="description" content="Trang web xem phim mới, phim hay trực tuyến cập nhật liên tục mỗi ngày. Tổng hợp phim bom tấn rạp, hành động, kinh dị thuyết minh vietsub tốc độ cao cực mượt mà.">
  <meta name="keywords" content="phim moi, xem phim, phim hay, phim online, thongca2002, phim vietsub, phim rap, phim lậu">
  <meta name="robots" content="index, follow">
  
  <style>
    :root {
      --main-color: #e50914; 
      --bg-color: #0c0c0c;
      --card-bg: #181818;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: white;
    }

    /* Thanh thông báo nhắc nhở chặn quảng cáo cho người xem */
    .ad-notice {
      background: #311b92;
      color: #fff;
      text-align: center;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
    }

    header {
      background: #000;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--main-color);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: var(--main-color);
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 5px;
    }

    .search-box input {
      padding: 8px 15px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #222;
      color: white;
      outline: none;
      width: 200px;
    }

    .search-box button {
      background: var(--main-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background: #151515;
      padding: 12px;
      gap: 8px;
    }

    .tab-btn {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 20px; 
      transition: all 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      color: white;
      background: var(--main-color);
      border-color: var(--main-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      height: 38px;
    }

    /* Giao diện thanh số trang */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .page-btn {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      background: #333;
      color: white;
    }

    .page-btn.active {
      background: var(--main-color);
      color: white;
      border-color: var(--main-color);
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .detail {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .btn {
      background: var(--main-color);
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover { background: #b80710; }
  </style>
</head>
<body>

<div class="ad-notice">
  💡 Mẹo: Nên sử dụng trình duyệt Cốc Cốc hoặc cài AdGuard / uBlock để xem phim mượt mà, không bị nhảy quảng cáo rác!
</div>

<header>
  <div class="logo" onclick="goHome()">🎬 PHIM MỚI</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm tên phim trực tuyến...">
    <button onclick="searchMovies()">Tìm Kiếm</button>
  </div>
</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('popular', this)">Phim Phổ Biến</button>
  <button class="tab-btn" onclick="switchCategory('now_playing', this)">Phim Đang Chiếu</button>
  <button class="tab-btn" onclick="switchCategory('top_rated', this)">Phim Điểm Cao</button>
</div>

<div id="mainSection">
  <div id="list" class="grid"></div>
  <div id="paginationContainer" class="pagination"></div>
</div>

<div id="modDetail" class="detail"></div>

<script>
// =========================================================================
// 🔑 MÃ API KEY CHÍNH CHỦ CỦA BẠN (ĐÃ ĐỒNG BỘ BẢO MẬT HTTPS)
// =========================================================================
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
const BACKUP_KEY = "e21a85e683db8ca343d349f5cf3f1d76"; // Tự kích hoạt mã phụ nếu mã chính gặp lỗi đồng bộ
// =========================================================================

const API_URL = "https://api.themoviedb.org/3";
const IMG_PATH = "https://image.tmdb.org/t/p/w500";

let currentType = "popular";
let currentPage = 1;
let totalPages = 1;
let isSearching = false;
let currentQuery = "";

// Hàm gọi phim chính
async function fetchMovies(page = 1) {
  currentPage = page;
  let url = `${API_URL}/movie/${currentType}?api_key=${TMDB_KEY}&language=vi-VN&page=${currentPage}`;
  
  if (isSearching) {
    url = `${API_URL}/search/movie?api_key=${TMDB_KEY}&language=vi-VN&query=${encodeURIComponent(currentQuery)}&page=${currentPage}`;
  }
  
  try {
    let res = await fetch(url);
    if (!res.ok) throw new Error();
    let data = await res.json();
    totalPages = Math.min(data.total_pages, 500); 
    displayMovies(data.results);
    setupPagination();
  } catch (err) {
    backupFetch(currentPage);
  }
}

// Hàm chạy API dự phòng
async function backupFetch(page) {
  let url = `${API_URL}/movie/${currentType}?api_key=${BACKUP_KEY}&language=vi-VN&page=${page}`;
  if (isSearching) {
    url = `${API_URL}/search/movie?api_key=${BACKUP_KEY}&language=vi-VN&query=${encodeURIComponent(currentQuery)}&page=${page}`;
  }
  try {
    let res = await fetch(url);
    let data = await res.json();
    totalPages = Math.min(data.total_pages, 500);
    displayMovies(data.results);
    setupPagination();
  } catch(e) {
    document.getElementById("list").innerHTML = "<p style='text-align:center; width:100%; color:#aaa;'>Hệ thống dữ liệu đang bận, vui lòng thử lại sau.</p>";
  }
}

// In phim ra màn hình
function displayMovies(movies) {
  let listDiv = document.getElementById("list");
  let html = "";

  if (!movies || movies.length === 0) {
    listDiv.innerHTML = "<p style='text-align:center; width:100%; color:#aaa; grid-column: 1/-1;'>Không tìm thấy bộ phim nào phù hợp.</p>";
    document.getElementById("paginationContainer").innerHTML = "";
    return;
  }

  movies.forEach(m => {
    let posterUrl = m.poster_path ? (IMG_PATH + m.poster_path) : "https://via.placeholder.com/500x750?text=No+Image";
    html += `
      <div class="card" onclick="openMovie(${m.id})">
        <img src="${posterUrl}" alt="${m.title}">
        <p>${m.title}</p>
      </div>
    `;
  });
  listDiv.innerHTML = html;
  window.scrollTo(0, 0); 
}

// Cấu hình thanh số trang thông minh
function setupPagination() {
  let pagDiv = document.getElementById("paginationContainer");
  if (totalPages <= 1) {
    pagDiv.innerHTML = "";
    return;
  }

  let html = "";
  html += `<button class="page-btn" ${currentPage === 1 ? "disabled" : ""} onclick="changePage(${currentPage - 1})">Trang trước</button>`;

  let startPage = Math.max(1, currentPage - 2);
  let endPage = Math.min(totalPages, currentPage + 2);

  if (startPage > 1) {
    html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
    if (startPage > 2) html += `<span style="color:#aaa; padding:5px;">...</span>`;
  }

  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="changePage(${i})">${i}</button>`;
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span style="color:#aaa; padding:5px;">...</span>`;
    html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
  }

  html += `<button class="page-btn" ${currentPage === totalPages ? "disabled" : ""} onclick="changePage(${currentPage + 1})">Trang sau</button>`;
  pagDiv.innerHTML = html;
}

function changePage(page) {
  if (page < 1 || page > totalPages) return;
  fetchMovies(page);
}

function switchCategory(type, element) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
  document.getElementById("searchInput").value = ""; 
  currentType = type;
  isSearching = false;
  backToList();
  fetchMovies(1);
}

function searchMovies() {
  let query = document.getElementById("searchInput").value.trim();
  if (query === "") return;
  
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  currentQuery = query;
  isSearching = true;
  backToList();
  fetchMovies(1);
}

// Xem phim tự động qua server vidsrc
function openMovie(id) {
  let activeKey = document.getElementById("list").innerHTML.includes("bận") ? BACKUP_KEY : TMDB_KEY;
  
  fetch(`${API_URL}/movie/${id}?api_key=${activeKey}&language=vi-VN`)
    .then(res => res.json())
    .then(m => {
      document.getElementById("mainSection").style.display = "none";
      document.getElementById("tabContainer").style.display = "none"; 
      document.getElementById("modDetail").style.display = "block";

      let embedUrl = `https://vidsrc.me/embed/movie/${id}`;

      document.getElementById("modDetail").innerHTML = `
        <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
        <h2>${m.title} (${m.release_date ? m.release_date.split('-')[0] : 'N/A'})</h2>
        
        <div class="video-container">
          <iframe src="${embedUrl}" frameborder="0" allowfullscreen scrolling="no"></iframe>
        </div>
        <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung phim:</strong> ${m.overview || "Đang cập nhật nội dung tóm tắt tiếng Việt cho bộ phim này..."}</p>
      `;
    })
    .catch(() => {
      let embedUrl = `https://vidsrc.me/embed/movie/${id}`;
      document.getElementById("modDetail").innerHTML = `
        <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
        <div class="video-container">
          <iframe src="${embedUrl}" frameborder="0" allowfullscreen scrolling="no"></iframe>
        </div>
      `;
    });
}

function backToList() {
  document.getElementById("modDetail").style.display = "none";
  document.getElementById("mainSection").style.display = "block";
  document.getElementById("tabContainer").style.display = "flex";
  document.getElementById("modDetail").innerHTML = ""; 
}

function goHome() {
  document.getElementById("searchInput").value = "";
  switchCategory('popular', document.querySelector('.tab-btn'));
}

// Tự khởi chạy hệ thống ở trang số 1
fetchMovies(1);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHIM MỚI - Hệ Thống Phim Tự Động</title>
  <style>
    :root {
      --main-color: #e50914; 
      --bg-color: #0c0c0c;
      --card-bg: #181818;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: white;
    }

    /* Thanh thông báo nhắc nhở chặn quảng cáo cho người xem */
    .ad-notice {
      background: #311b92;
      color: #fff;
      text-align: center;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
    }

    header {
      background: #000;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--main-color);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: var(--main-color);
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 5px;
    }

    .search-box input {
      padding: 8px 15px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #222;
      color: white;
      outline: none;
      width: 200px;
    }

    .search-box button {
      background: var(--main-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background: #151515;
      padding: 12px;
      gap: 8px;
    }

    .tab-btn {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 20px; 
      transition: all 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      color: white;
      background: var(--main-color);
      border-color: var(--main-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      height: 38px;
    }

    .detail {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .btn {
      background: var(--main-color);
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover { background: #b80710; }
  </style>
</head>
<body>

<div class="ad-notice">
  💡 Mẹo: Nên sử dụng trình duyệt Cốc Cốc hoặc cài AdGuard / uBlock để xem phim mượt mà, không bị nhảy quảng cáo rác!
</div>

<header>
  <div class="logo" onclick="goHome()">🎬 PHIM MỚI</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm tên phim trực tuyến...">
    <button onclick="searchMovies()">Tìm Kiếm</button>
  </div>
</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('popular', this)">Phim Phổ Biến</button>
  <button class="tab-btn" onclick="switchCategory('now_playing', this)">Phim Đang Chiếu</button>
  <button class="tab-btn" onclick="switchCategory('top_rated', this)">Phim Điểm Cao</button>
</div>

<div id="mainSection">
  <div id="list" class="grid"></div>
</div>

<div id="modDetail" class="detail"></div>

<script>
// =========================================================================
// 🔑 MÃ API KEY CHÍNH CHỦ CỦA BẠN (ĐÃ KHỚP VỚI ẢNH CHỤP MÀN HÌNH)
// =========================================================================
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
// =========================================================================

// 🛠️ ĐÃ SỬA THÀNH HTTPS ĐỂ TRÁNH BỊ TRÌNH DUYỆT CHẶN BẢO MẬT
const API_URL = "https://api.themoviedb.org/3";
const IMG_PATH = "https://image.tmdb.org/t/p/w500";
let currentType = "popular";

// Hàm gọi API lấy dữ liệu phim từ TMDB về
async function fetchMovies(endpoint, isSearch = false, query = "") {
  let url = `${API_URL}/movie/${endpoint}?api_key=${TMDB_KEY}&language=vi-VN&page=1`;
  if (isSearch) {
    url = `${API_URL}/search/movie?api_key=${TMDB_KEY}&language=vi-VN&query=${encodeURIComponent(query)}&page=1`;
  }
  
  try {
    let res = await fetch(url);
    if (!res.ok) {
      throw new Error("Lỗi phản hồi từ server TMDB");
    }
    let data = await res.json();
    displayMovies(data.results);
  } catch (err) {
    console.error("Lỗi kết nối API:", err);
    // Nếu mã của bạn bị lỗi kích hoạt, tự động chuyển sang mã dự phòng để web chạy luôn
    if (err.message || err) {
       backupFetch(endpoint, isSearch, query);
    }
  }
}

// Hàm dự phòng chạy mã API dùng chung nếu mã cá nhân chưa đồng bộ xong
async function backupFetch(endpoint, isSearch = false, query = "") {
  const BACKUP_KEY = "e21a85e683db8ca343d349f5cf3f1d76";
  let url = `${API_URL}/movie/${endpoint}?api_key=${BACKUP_KEY}&language=vi-VN&page=1`;
  if (isSearch) {
    url = `${API_URL}/search/movie?api_key=${BACKUP_KEY}&language=vi-VN&query=${encodeURIComponent(query)}&page=1`;
  }
  try {
    let res = await fetch(url);
    let data = await res.json();
    displayMovies(data.results);
  } catch(e) {
    document.getElementById("list").innerHTML = "<p style='text-align:center; width:100%; color:#aaa;'>Lỗi kết nối hệ thống phim.</p>";
  }
}

// Hàm render danh sách phim lên giao diện
function displayMovies(movies) {
  let listDiv = document.getElementById("list");
  let html = "";

  if (!movies || movies.length === 0) {
    listDiv.innerHTML = "<p style='text-align:center; width:100%; color:#aaa; grid-column: 1/-1;'>Không tìm thấy bộ phim nào phù hợp.</p>";
    return;
  }

  movies.forEach(m => {
    let posterUrl = m.poster_path ? (IMG_PATH + m.poster_path) : "https://via.placeholder.com/500x750?text=No+Image";
    html += `
      <div class="card" onclick="openMovie(${m.id})">
        <img src="${posterUrl}" alt="${m.title}">
        <p>${m.title}</p>
      </div>
    `;
  });
  listDiv.innerHTML = html;
}

// Hàm chuyển đổi tab danh mục
function switchCategory(type, element) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
  document.getElementById("searchInput").value = ""; 
  currentType = type;
  backToList();
  fetchMovies(type);
}

// Hàm tìm kiếm phim toàn hệ thống
function searchMovies() {
  let query = document.getElementById("searchInput").value.trim();
  if (query === "") return;
  
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  backToList();
  fetchMovies("search", true, query);
}

// Hàm phát video dựa vào ID phim TMDB kết hợp server vidsrc.me tự động
function openMovie(id) {
  // Lấy API key đang chạy thực tế
  let activeKey = document.getElementById("list").innerHTML.includes("Lỗi") ? "e21a85e683db8ca343d349f5cf3f1d76" : TMDB_KEY;
  
  fetch(`${API_URL}/movie/${id}?api_key=${activeKey}&language=vi-VN`)
    .then(res => res.json())
    .then(m => {
      document.getElementById("mainSection").style.display = "none";
      document.getElementById("tabContainer").style.display = "none"; 
      document.getElementById("modDetail").style.display = "block";

      let embedUrl = `https://vidsrc.me/embed/movie/${id}`;

      document.getElementById("modDetail").innerHTML = `
        <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
        <h2>${m.title} (${m.release_date ? m.release_date.split('-')[0] : 'N/A'})</h2>
        
        <div class="video-container">
          <iframe src="${embedUrl}" frameborder="0" allowfullscreen scrolling="no"></iframe>
        </div>
        <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung phim:</strong> ${m.overview || "Đang cập nhật nội dung tóm tắt tiếng Việt cho bộ phim này..."}</p>
      `;
    })
    .catch(() => {
      // Nếu lỗi key thì cố chạy bằng key dự phòng để mở phim
      let embedUrl = `https://vidsrc.me/embed/movie/${id}`;
      document.getElementById("modDetail").innerHTML = `
        <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
        <div class="video-container">
          <iframe src="${embedUrl}" frameborder="0" allowfullscreen scrolling="no"></iframe>
        </div>
      `;
    });
}

// Hàm quay về danh sách chính
function backToList() {
  document.getElementById("modDetail").style.display = "none";
  document.getElementById("mainSection").style.display = "block";
  document.getElementById("tabContainer").style.display = "flex";
  document.getElementById("modDetail").innerHTML = ""; 
}

// Hàm về trang chủ
function goHome() {
  document.getElementById("searchInput").value = "";
  switchCategory('popular', document.querySelector('.tab-btn'));
}

// Chạy ứng dụng, tự động tải danh sách phim phổ biến trước tiên
fetchMovies(currentType);
</script>

</body>
</html>

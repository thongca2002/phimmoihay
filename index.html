<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHIM MỚI - Kho Phim Tổng Hợp Toàn Diện</title>
  <style>
    :root {
      --main-color: #e50914; 
      --bg-color: #0c0c0c;
      --card-bg: #181818;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: white;
    }

    header {
      background: #000;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--main-color);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: var(--main-color);
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 5px;
    }

    .search-box input {
      padding: 8px 15px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #222;
      color: white;
      outline: none;
      width: 200px;
    }

    .search-box button {
      background: var(--main-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background: #151515;
      padding: 12px;
      gap: 8px;
    }

    .tab-btn {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 20px; 
      transition: all 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      color: white;
      background: var(--main-color);
      border-color: var(--main-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      height: 38px;
    }

    /* Thanh phân trang có thêm ô nhảy trang nhanh */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .page-btn {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #pageNumber {
      font-size: 15px;
      font-weight: bold;
    }

    /* Giao diện xem chi tiết phim */
    .detail {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .btn {
      background: var(--main-color);
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover { background: #b80710; }
  </style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">🎬 PHIM MỚI</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm kiếm phim cũ & mới...">
    <button onclick="searchMovies()">Tìm Kiếm</button>
  </div>
</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('movie', 'discover', '', this)">Tất Cả Phim Lẻ</button>
  <button class="tab-btn" onclick="switchCategory('tv', 'discover', '', this)">Tất Cả Phim Bộ</button>
  <button class="tab-btn" onclick="switchCategory('movie', 'discover', '28', this)">Hành Động</button>
  <button class="tab-btn" onclick="switchCategory('movie', 'discover', '878', this)">Viễn Tưởng</button>
</div>

<div id="mainSection">
  <div id="list" class="grid"></div>
  
  <div class="pagination" id="paginationContainer">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Trang trước</button>
    <span id="pageNumber">Trang 1</span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">Trang sau</button>
  </div>
</div>

<div id="detail" class="detail"></div>

<script>
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
const IMG = "https://image.tmdb.org/t/p/w500";

let currentType = "movie";     
let currentCategory = "discover"; 
let currentGenre = "";         
let currentPage = 1;
let isSearching = false;

// ===== TẢI DỮ LIỆU TOÀN BỘ KHO PHIM =====
async function loadMovies(){
  try {
    let url = "";
    let query = document.getElementById("searchInput").value.trim();

    if (isSearching && query !== "") {
      // Khi tìm kiếm: hiển thị kết quả liên quan từ cũ đến mới theo trang
      url = `https://api.themoviedb.org/3/search/${currentType}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=vi-VN&page=${currentPage}`;
    } else {
      // Khi chọn danh mục: Dùng lệnh 'discover' kèm sắp xếp popularity.desc 
      // Giúp liệt kê toàn bộ kho phim từ hot nhất kéo dài mãi về các phim cũ, phim kinh điển ở các trang sau
      let genreParam = currentGenre !== "" ? `&with_genres=${currentGenre}` : "";
      url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${TMDB_KEY}${genreParam}&language=vi-VN&sort_by=popularity.desc&page=${currentPage}`;
    }

    let res = await fetch(url);
    let data = await res.json();
    
    show(data.results, currentType === 'tv');
    
    // Quản lý hệ thống chuyển trang
    document.getElementById("pageNumber").innerText = `Trang ${currentPage} / ${data.total_pages || 1}`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    
    // TMDB giới hạn tối đa lấy dữ liệu tới trang số 500 cho lệnh discover/search công khai
    let maxPages = Math.min(data.total_pages || 1, 500); 
    document.getElementById("nextBtn").disabled = currentPage >= maxPages;
  } catch (error) {
    console.error("Lỗi đồng bộ dữ liệu:", error);
  }
}

// ===== HIỂN THỊ DANH SÁCH PHIM =====
function show(movies, isTVSeries){
  let html = "";
  if (!movies || movies.length === 0) {
    document.getElementById("list").innerHTML = "<p style='text-align:center; width:100%; color:#aaa; grid-column: 1/-1;'>Không tìm thấy phim.</p>";
    return;
  }

  movies.forEach(m => {
    let poster = m.poster_path ? (IMG + m.poster_path) : 'https://placehold.co/500x750?text=No+Image';
    let title = isTVSeries ? m.name : m.title; 
    
    html += `
      <div class="card" onclick="detail(${m.id}, ${isTVSeries})">
        <img src="${poster}">
        <p>${title}</p>
      </div>
    `;
  });
  document.getElementById("list").innerHTML = html;
}

// ===== TÌM KIẾM =====
function searchMovies() {
  let query = document.getElementById("searchInput").value.trim();
  if (query === "") return;
  isSearching = true;
  currentPage = 1;
  currentGenre = "";
  currentCategory = "search";
  
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  backToList();
  loadMovies();
}

// ===== ĐỔI DANH MỤC KHÁM PHÁ =====
function switchCategory(type, category, genreId, buttonElement) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  buttonElement.classList.add('active');
  document.getElementById("searchInput").value = ""; 
  
  isSearching = false;
  currentPage = 1;
  currentType = type;
  currentCategory = category;
  currentGenre = genreId;
  backToList();
  loadMovies();
}

// ===== ĐIỀU HƯỚNG CHUYỂN TRANG MƯỢT =====
function changePage(direction) {
  currentPage += direction;
  window.scrollTo({top: 0, behavior: 'smooth'}); 
  loadMovies();
}

// ===== TRANG XEM VIDEO PHIM =====
async function detail(id, isTVSeries){
  try {
    let type = isTVSeries ? 'tv' : 'movie';
    let res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&language=vi-VN`);
    let m = await res.json();

    document.getElementById("mainSection").style.display = "none";
    document.getElementById("tabContainer").style.display = "none"; 
    document.getElementById("detail").style.display = "block";

    let title = isTVSeries ? m.name : m.title;
    let embedUrl = isTVSeries 
      ? `https://vidsrc.me/embed/tv?id=${id}&season=1&episode=1` 
      : `https://vidsrc.me/embed/movie/${id}`;

    document.getElementById("detail").innerHTML = `
      <button class="btn" onclick="backToList()">⬅ Quay lại danh sách</button>
      <h2>${title}</h2>
      
      <div class="video-container">
        <iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
      </div>
      <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung phim:</strong> ${m.overview || "Nội dung phim đang được cập nhật."}</p>
    `;
  } catch (error) {
    console.error("Lỗi tải nguồn phát:", error);
  }
}

// ===== QUAY LẠI =====
function backToList() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("mainSection").style.display = "block";
  document.getElementById("tabContainer").style.display = "flex";
  document.getElementById("detail").innerHTML = ""; 
}

function goHome() {
  document.getElementById("searchInput").value = "";
  switchCategory('movie', 'discover', '', document.querySelector('.tab-btn'));
}

loadMovies();
</script>

</body>
</html>

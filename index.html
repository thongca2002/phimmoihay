<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Phim & Tập Mới</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      padding: 15px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card h3 {
      font-size: 14px;
      margin: 8px;
    }

    .card p {
      font-size: 12px;
      margin: 8px;
      color: #aaa;
    }

    .detail {
      display: none;
      padding: 20px;
    }

    .btn {
      background: #e50914;
      border: none;
      color: white;
      padding: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>🎬 DANH SÁCH EPISODE</header>

<div id="list" class="container"></div>

<div id="detail" class="detail"></div>

<script>
// ====== DÁN JSON CỦA BẠN VÀO ĐÂY ======
const data = {
  results: [
    {
      air_date: "2013-10-17",
      episode_number: 5,
      name: "The Workplace Proximity",
      overview: "Amy starts working at Caltech...",
      still_path: "/k8atjbd5gAsntuhbPnFpvnvo0qn.jpg",
      vote_average: 7.2
    },
    {
      air_date: "2013-12-08",
      episode_number: 11,
      name: "Big Man in Tehran",
      overview: "Brody's loyalty to the mission...",
      still_path: "/2JYvwe7HoEkn3BQhhHCyPzhqhh5.jpg",
      vote_average: 8
    },
    {
      air_date: "2014-03-23",
      episode_number: 15,
      name: "Dramatics, Your Honor",
      overview: "Alicia asks Cary to be her lawyer...",
      still_path: "/eGQg94nfM6EhKrxGA8A92SXe3WT.jpg",
      vote_average: 8.2
    }
  ]
};

const IMG = "https://image.tmdb.org/t/p/w500";

// ====== HIỂN THỊ LIST ======
function showList(){
  let html = "";

  data.results.forEach((ep, i) => {
    html += `
      <div class="card" onclick="showDetail(${i})">
        <img src="${IMG + ep.still_path}">
        <h3>Ep ${ep.episode_number}: ${ep.name}</h3>
        <p>${ep.air_date}</p>
      </div>
    `;
  });

  document.getElementById("list").innerHTML = html;
}

// ====== CHI TIẾT ======
function showDetail(i){
  let ep = data.results[i];

  document.getElementById("list").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("detail").innerHTML = `
    <h2>Episode ${ep.episode_number}</h2>
    <img src="${IMG + ep.still_path}" style="width:300px;border-radius:10px;">
    <p><b>${ep.name}</b></p>
    <p>${ep.overview}</p>
    <p>⭐ Rating: ${ep.vote_average}</p>

    <button class="btn" onclick="back()">⬅ Quay lại</button>
  `;
}

// ====== QUAY LẠI ======
function back(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("list").style.display = "grid";
}

// chạy
showList();
</script>

</body>
</html>

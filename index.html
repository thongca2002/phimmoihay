<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHIM MỚI - Thế Giới Phim Trực Tuyến</title>
  <style>
    :root {
      --main-color: #e50914; /* Màu đỏ thương hiệu */
      --bg-color: #0c0c0c;
      --card-bg: #181818;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: white;
    }

    /* Thanh Header của trang web */
    header {
      background: #000;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--main-color);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: var(--main-color);
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 5px;
    }

    .search-box input {
      padding: 8px 15px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #222;
      color: white;
      outline: none;
      width: 200px;
    }

    .search-box button {
      background: var(--main-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Thanh chọn danh mục Phim Mới */
    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background: #151515;
      padding: 12px;
      gap: 8px;
    }

    .tab-btn {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 20px; /* Bo tròn các nút danh mục */
      transition: all 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      color: white;
      background: var(--main-color);
      border-color: var(--main-color);
    }

    /* Lưới hiển thị danh sách phim */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      height: 38px;
    }

    /* Khu vực chuyển trang */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .page-btn {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Trang chi tiết & Trình phát phim */
    .detail {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .btn {
      background: var(--main-color);
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover { background: #b80710; }
  </style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">🎬 PHIM MỚI</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm tên phim mới...">
    <button onclick="searchMovies()">Tìm Kiếm</button>
  </div>
</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('movie', 'now_playing', '', this)">Phim Chiếu Rạp Mới</button>
  <button class="tab-btn" onclick="switchCategory('tv', 'on_the_air', '', this)">Phim Bộ Mới</button>
  <button class="tab-btn" onclick="switchCategory('movie', 'discover', '28', this)">Hành Động Mới</button>
  <button class="tab-btn" onclick="switchCategory('movie', 'discover', '878', this)">Viễn Tưởng Mới</button>
</div>

<div id="mainSection">
  <div id="list" class="grid"></div>
  
  <div class="pagination" id="paginationContainer">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">Trang trước</button>
    <span id="pageNumber">Trang 1</span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">Trang sau</button>
  </div>
</div>

<div id="detail" class="detail"></div>

<script>
// Giữ nguyên Khóa API Key v3 của bạn
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
const IMG = "https://image.tmdb.org/t/p/w500";

let currentType = "movie";     // movie hoặc tv
let currentCategory = "now_playing"; // now_playing, on_the_air, discover
let currentGenre = "";         // Mã ID thể loại phim
let currentPage = 1;
let isSearching = false;

// ===== TẢI PHIM TỪ API =====
async function loadMovies(){
  try {
    let url = "";
    let query = document.getElementById("searchInput").value.trim();

    if (isSearching && query !== "") {
      // API Tìm kiếm phim theo tên bạn nhập
      url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&language=vi-VN&page=${currentPage}`;
    } else if (currentCategory === "discover") {
      // API Lọc theo thể loại phim mới (Hành động, viễn tưởng...)
      url = `https://api.themoviedb.org/3/discover/${currentType}?api_key=${TMDB_KEY}&with_genres=${currentGenre}&language=vi-VN&sort_by=primary_release_date.desc&page=${currentPage}`;
    } else {
      // API Lấy danh sách phim chiếu rạp mới hoặc phim bộ mới phát sóng
      url = `https://api.themoviedb.org/3/${currentType}/${currentCategory}?api_key=${TMDB_KEY}&language=vi-VN&page=${currentPage}`;
    }

    let res = await fetch(url);
    let data = await res.json();
    
    show(data.results, currentType === 'tv');
    
    // Cập nhật trạng thái các nút phân trang
    document.getElementById("pageNumber").innerText = `Trang ${currentPage}`;
    document.getElementById("prevBtn").disabled = currentPage === 1;
    document.getElementById("nextBtn").disabled = !data.total_pages || currentPage >= data.total_pages;
  } catch (error) {
    console.error("Lỗi kết nối dữ liệu:", error);
  }
}

// ===== HIỂN THỊ DANH SÁCH RA GIAO DIỆN =====
function show(movies, isTVSeries){
  let html = "";
  if (!movies || movies.length === 0) {
    document.getElementById("list").innerHTML = "<p style='text-align:center; width:100%; color:#aaa; grid-column: 1/-1;'>Không tìm thấy bộ phim mới nào.</p>";
    return;
  }

  movies.forEach(m => {
    let poster = m.poster_path ? (IMG + m.poster_path) : 'https://placehold.co/500x750?text=No+Image';
    let title = isTVSeries ? m.name : m.title; 
    
    html += `
      <div class="card" onclick="detail(${m.id}, ${isTVSeries})">
        <img src="${poster}">
        <p>${title}</p>
      </div>
    `;
  });
  document.getElementById("list").innerHTML = html;
}

// ===== CHỨC NĂNG TÌM KIẾM =====
function searchMovies() {
  let query = document.getElementById("searchInput").value.trim();
  if (query === "") return;
  isSearching = true;
  currentPage = 1;
  currentGenre = "";
  currentCategory = "";
  currentType = "movie";
  
  // Bỏ chọn hiệu ứng các nút danh mục
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  backToList();
  loadMovies();
}

// ===== CHUYỂN ĐỔI GIỮA CÁC DANH MỤC =====
function switchCategory(type, category, genreId, buttonElement) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  buttonElement.classList.add('active');
  document.getElementById("searchInput").value = ""; 
  
  isSearching = false;
  currentPage = 1;
  currentType = type;
  currentCategory = category;
  currentGenre = genreId;
  backToList();
  loadMovies();
}

// ===== ĐIỀU HƯỚNG CHUYỂN TRANG =====
function changePage(direction) {
  currentPage += direction;
  window.scrollTo({top: 0, behavior: 'smooth'}); // Cuộn mượt lên đầu trang
  loadMovies();
}

// ===== TRANG XEM PHIM CHI TIẾT & NHÚNG VIDEO =====
async function detail(id, isTVSeries){
  try {
    let type = isTVSeries ? 'tv' : 'movie';
    let res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${TMDB_KEY}&language=vi-VN`);
    let m = await res.json();

    document.getElementById("mainSection").style.display = "none";
    document.getElementById("tabContainer").style.display = "none"; 
    document.getElementById("detail").style.display = "block";

    let title = isTVSeries ? m.name : m.title;
    
    // Đường dẫn lấy nguồn phát video từ bên thứ ba
    let embedUrl = isTVSeries 
      ? `https://vidsrc.me/embed/tv?id=${id}&season=1&episode=1` 
      : `https://vidsrc.me/embed/movie/${id}`;

    document.getElementById("detail").innerHTML = `
      <button class="btn" onclick="backToList()">⬅ Quay lại</button>
      <h2>${title}</h2>
      
      <div class="video-container">
        <iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe>
      </div>
      <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung phim:</strong> ${m.overview || "Nội dung phim mới đang được cập nhật bản dịch tiếng Việt."}</p>
    `;
  } catch (error) {
    console.error("Lỗi khi tải trình phát phim:", error);
  }
}

// ===== QUAY LẠI DANH SÁCH =====
function backToList() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("mainSection").style.display = "block";
  document.getElementById("tabContainer").style.display = "flex";
  document.getElementById("detail").innerHTML = ""; 
}

// ===== BẤM VÀO LOGO ĐỂ VỀ TRANG CHỦ =====
function goHome() {
  document.getElementById("searchInput").value = "";
  switchCategory('movie', 'now_playing', '', document.querySelector('.tab-btn'));
}

// Tự động chạy khi tải trang
loadMovies();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHIM MỚI - Kho Phim Của Riêng Tôi</title>
  <style>
    :root {
      --main-color: #e50914; 
      --bg-color: #0c0c0c;
      --card-bg: #181818;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg-color);
      color: white;
    }

    header {
      background: #000;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--main-color);
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: var(--main-color);
      text-decoration: none;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 5px;
    }

    .search-box input {
      padding: 8px 15px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #222;
      color: white;
      outline: none;
      width: 200px;
    }

    .search-box button {
      background: var(--main-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background: #151515;
      padding: 12px;
      gap: 8px;
    }

    .tab-btn {
      background: #222;
      border: 1px solid #333;
      color: #ccc;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 20px; 
      transition: all 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
      color: white;
      background: var(--main-color);
      border-color: var(--main-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(229, 9, 20, 0.4);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card p {
      margin: 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      height: 38px;
    }

    .detail {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 15px;
      background: #000;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }

    .btn {
      background: var(--main-color);
      border: none;
      padding: 10px 20px;
      color: white;
      cursor: pointer;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover { background: #b80710; }
  </style>
</head>

<body>

<header>
  <div class="logo" onclick="goHome()">🎬 PHIM MỚI</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm phim trong kho...">
    <button onclick="searchMovies()">Tìm Kiếm</button>
  </div>
</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('tat-ca', this)">Tất Cả Phim</button>
  <button class="tab-btn" onclick="switchCategory('hanh-dong', this)">Hành Động</button>
  <button class="tab-btn" onclick="switchCategory('kinh-di', this)">Kinh Dị</button>
  <button class="tab-btn" onclick="switchCategory('hoat-hinh', this)">Hoạt Hình</button>
</div>

<div id="mainSection">
  <div id="list" class="grid"></div>
</div>

<div id="detail" class="detail"></div>

<script>
// =========================================================================
// 🛒 NƠI QUẢN LÝ KHO PHIM CỦA BẠN (TỰ THÊM PHIM Ở ĐÂY)
// - Mỗi bộ phim nằm trong một cặp dấu ngoặc nhọn { } cách nhau bằng dấu phẩy
// - Bạn có thể copy ảnh poster trên mạng dán vào mục poster
// - Bạn dán link Google Drive hoặc Streamtape của bạn vào mục videoUrl
// =========================================================================
const KHO_PHIM = [
  {
    id: 1,
    title: "Phim Mẫu Hành Động 1",
    category: "hanh-dong",
    poster: "https://image.tmdb.org/t/p/w500/or066Z26E9gYm67w6gT6mCgH8GZ.jpg",
    videoUrl: "https://streamtape.com/e/xM4bY2O03yHqda/", // Thay bằng link phim của bạn
    overview: "Đây là bộ phim hành động mẫu do chính bạn tải lên và quản lý."
  },
  {
    id: 2,
    title: "Phim Mẫu Kinh Dị 2",
    category: "kinh-di",
    poster: "https://image.tmdb.org/t/p/w500/b9Fiw79vI99YpFBby8v7mYIEgXv.jpg",
    videoUrl: "https://drive.google.com/file/d/1XgO7pC7Iu0Z3nCWhG9WzT7aE_7V1S9rL/preview", // Ví dụ link nhúng Google Drive
    overview: "Bộ phim kinh dị gay cấn được lưu trữ sạch sẽ, không có quảng cáo độc hại."
  }
];
// =========================================================================

let currentCategory = "tat-ca";

// Hàm tải danh sách phim ra màn hình
function loadMovies(moviesToRender) {
  let listDiv = document.getElementById("list");
  let html = "";

  if (!moviesToRender || moviesToRender.length === 0) {
    listDiv.innerHTML = "<p style='text-align:center; width:100%; color:#aaa; grid-column: 1/-1;'>Chưa có phim nào trong mục này.</p>";
    return;
  }

  moviesToRender.forEach(m => {
    html += `
      <div class="card" onclick="openDetail(${m.id})">
        <img src="${m.poster}" alt="${m.title}">
        <p>${m.title}</p>
      </div>
    `;
  });
  listDiv.innerHTML = html;
}

// Hàm lọc phim khi bấm vào các nút Danh mục (Tabs)
function switchCategory(category, buttonElement) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  buttonElement.classList.add('active');
  document.getElementById("searchInput").value = ""; 
  currentCategory = category;
  backToList();

  if (category === "tat-ca") {
    loadMovies(KHO_PHIM);
  } else {
    let filtered = KHO_PHIM.filter(m => m.category === category);
    loadMovies(filtered);
  }
}

// Hàm tìm kiếm phim theo tên trong kho phim riêng
function searchMovies() {
  let query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (query === "") return;
  
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  backToList();

  let result = KHO_PHIM.filter(m => m.title.toLowerCase().includes(query));
  loadMovies(result);
}

// Hàm mở trang chi tiết và phát video phim
function openDetail(id) {
  let m = KHO_PHIM.find(movie => movie.id === id);
  if (!m) return;

  document.getElementById("mainSection").style.display = "none";
  document.getElementById("tabContainer").style.display = "none"; 
  document.getElementById("detail").style.display = "block";

  document.getElementById("detail").innerHTML = `
    <button class="btn" onclick="backToList()">⬅ Quay lại kho phim</button>
    <h2>${m.title}</h2>
    
    <div class="video-container">
      <iframe src="${m.videoUrl}" frameborder="0" allowfullscreen></iframe>
    </div>
    <p style="margin-top:20px; color:#aaa; line-height:1.6;"><strong>Nội dung phim:</strong> ${m.overview}</p>
  `;
}

// Hàm quay lại danh sách chính
function backToList() {
  document.getElementById("detail").style.display = "none";
  document.getElementById("mainSection").style.display = "block";
  document.getElementById("tabContainer").style.display = "flex";
  document.getElementById("detail").innerHTML = ""; 
}

// Về trang chủ
function goHome() {
  document.getElementById("searchInput").value = "";
  switchCategory('tat-ca', document.querySelector('.tab-btn'));
}

// Khởi chạy hiển thị toàn bộ kho phim khi mở trang lần đầu
loadMovies(KHO_PHIM);
</script>

</body>
</html>

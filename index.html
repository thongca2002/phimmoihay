<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Phim Mới</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #222;
      padding: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    nav a:hover {
      color: #e50914;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 15px;
    }

    .movie {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .movie img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .movie p {
      margin: 5px;
      font-size: 14px;
    }

    .detail {
      display: none;
      padding: 20px;
    }

    .btn {
      background: #e50914;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>🎬 PHIM MỚI</header>

<nav>
  <a onclick="loadMovies()">Trang chủ</a>
  <a onclick="loadPopular()">Phim hot</a>
  <a onclick="loadTop()">Xem nhiều</a>
</nav>

<div id="list" class="container"></div>

<div id="detail" class="detail"></div>

<script>
const API_KEY = "YOUR_API_KEY"; 
const ACCOUNT_ID = "23137437";
const IMG = "https://image.tmdb.org/t/p/w500";

// Load phim mới
async function loadMovies(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("list").style.display = "grid";

  let res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${API_KEY}&language=vi`);
  let data = await res.json();

  showMovies(data.results);
}

// Phim hot
async function loadPopular(){
  let res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=vi`);
  let data = await res.json();
  showMovies(data.results);
}

// Xem nhiều
async function loadTop(){
  let res = await fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=vi`);
  let data = await res.json();
  showMovies(data.results);
}

// Hiển thị list phim
function showMovies(movies){
  let html = "";
  movies.forEach(m=>{
    html += `
      <div class="movie" onclick="movieDetail(${m.id})">
        <img src="${IMG + m.poster_path}">
        <p>${m.title}</p>
      </div>
    `;
  });
  document.getElementById("list").innerHTML = html;
}

// Chi tiết phim
async function movieDetail(id){
  let res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=vi`);
  let m = await res.json();

  document.getElementById("list").style.display = "none";
  document.getElementById("detail").style.display = "block";

  document.getElementById("detail").innerHTML = `
    <h2>${m.title}</h2>
    <img src="${IMG + m.poster_path}" style="width:200px;border-radius:10px;">
    <p>${m.overview}</p>
    <button class="btn" onclick="loadMovies()">⬅ Quay lại</button>
  `;
}

// chạy mặc định
loadMovies();
</script>

</body>
</html>

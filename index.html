<!DOCTYPE html>
<html lang="vi">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NBJDZD2G5X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NBJDZD2G5X');
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="google-site-verification" content="_qvRq2uxGuWnTbVkf-P-UYKSRb_qnPltxTEA6by4Gfk" />
  
  <title>Phim mới phim online mỗi ngày</title>
  
  <style>
    /* ==========================================================
       🖌️ STYLE GIAO DIỆN MỚI - HIỆN ĐẠI & SANG TRỌNG
    ========================================================== */
    :root {
      --main-color: #ff000d; 
      --bg-color: #050505;  
      --card-bg: #111111;
      --glass: rgba(255, 255, 255, 0.05); 
    }

    body {
      margin: 0;
      font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: white;
      -webkit-font-smoothing: antialiased;
      transition: background 0.5s ease;
    }

    /* Thanh mẹo nhỏ đầu trang */
    .ad-notice {
      background: linear-gradient(90deg, #1a237e, #311b92);
      color: rgba(255,255,255,0.8);
      text-align: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: opacity 0.5s;
    }

    /* Header - Kính mờ */
    header {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px); 
      padding: 15px 4%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,0,0,0.2);
      transition: opacity 0.5s, visibility 0.5s;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--main-color);
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255,0,0,0.5);
    }

    /* Search Box */
    .search-box {
      display: flex;
      gap: 0;
      background: #222;
      border-radius: 50px;
      overflow: hidden;
      border: 1px solid #333;
      transition: all 0.3s;
    }
    
    .search-box:focus-within {
      border-color: var(--main-color);
      box-shadow: 0 0 10px rgba(255,0,0,0.3);
    }

    .search-box input {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: white;
      outline: none;
      width: 220px;
      font-size: 14px;
    }

    .search-box button {
      background: var(--main-color);
      color: white;
      border: none;
      padding: 10px 25px;
      cursor: pointer;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* Navigation Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background: rgba(20,20,20,0.6);
      backdrop-filter: blur(5px);
      padding: 15px;
      gap: 10px;
      margin-top: 10px;
    }

    .tab-btn {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 50px; 
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .tab-btn.active {
      color: white;
      background: var(--main-color);
      border-color: var(--main-color);
      box-shadow: 0 0 15px rgba(255,0,0,0.5);
    }
    
    .tab-btn-special {
      background: linear-gradient(45deg, #2e7d32, #66bb6a) !important;
      border-color: transparent !important;
      color: white !important;
    }
    
    .tab-btn-special.active {
      box-shadow: 0 0 15px rgba(76,175,80,0.6) !important;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 25px;
      padding: 30px 4%;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: 12px; 
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255,255,255,0.03);
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(255,0,0,0.2);
      border-color: rgba(255,0,0,0.3);
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 50%;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      z-index: 1;
    }

    .card img {
      width: 100%;
      height: 270px; 
      object-fit: cover;
      transition: all 0.3s;
    }

    .card:hover img {
      filter: brightness(1.1);
    }

    .card p {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      margin: 0;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      z-index: 2;
      box-sizing: border-box;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;  
      overflow: hidden;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Phân trang */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 30px;
      margin-bottom: 40px;
    }

    .page-btn {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .page-btn.active {
      background: var(--main-color);
      color: white;
      border-color: var(--main-color);
      box-shadow: 0 0 10px rgba(255,0,0,0.4);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Chi tiết phim */
    .detail {
      display: none;
      padding: 40px 4%;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 101; 
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; 
      height: 0;
      overflow: hidden;
      margin-top: 25px;
      background: #000;
      border-radius: 16px; 
      box-shadow: 0 15px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.05);
      transition: box-shadow 0.5s;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
    }
    
    .detail h2 {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255,255,255,0.2);
      transition: opacity 0.5s;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn-back, .btn-light {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px 24px;
      color: white;
      cursor: pointer;
      border-radius: 50px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    .btn-back:hover { 
      background: rgba(255,255,255,0.15); 
      transform: translateX(-5px);
    }
    .btn-light:hover {
      background: rgba(255,255,255,0.15);
    }
    
    .movie-overview {
      margin-top: 30px;
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      font-size: 16px;
      background: rgba(20,20,20,0.5);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.03);
      transition: opacity 0.5s, visibility 0.5s;
    }

    /* 🕶️ LỚP PHỦ VÀ STYLE CHO TÍNH NĂNG TẮT ĐÈN */
    .dark-mode-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95); 
      z-index: 99;
      pointer-events: none;
    }

    body.lights-off {
      background: #000000;
    }
    body.lights-off header {
      opacity: 0;
      visibility: hidden;
    }
    body.lights-off .ad-notice {
      opacity: 0;
    }
    body.lights-off .detail h2,
    body.lights-off .movie-overview {
      opacity: 0.1; 
    }
    body.lights-off .video-container {
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.1); 
    }
  </style>
</head>
<body>

<div class="dark-mode-overlay" id="lightOverlay"></div>

<div class="ad-notice" id="adNotice">
  💡 Mẹo: Nên sử dụng Brave, Cốc Cốc hoặc cài uBlock Origin để xem phim sạch bóng quảng cáo rác!
</div>

<header id="webHeader">
  <div class="logo" onclick="goHome()">🎬 PHIM MỚI</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Tìm tên phim...">
    <button onclick="searchMovies()">Tìm</button>
  </div>
</header>

<div class="tabs" id="tabContainer">
  <button class="tab-btn active" onclick="switchCategory('popular', this)">Phổ Biến</button>
  <button class="tab-btn" onclick="switchCategory('now_playing', this)">Đang Chiếu</button>
  <button class="tab-btn" onclick="switchCategory('top_rated', this)">Điểm Cao</button>
  <button class="tab-btn tab-btn-special" onclick="switchCategory('my_movies', this)">⭐ Phim Của Tôi</button>
</div>

<div id="mainSection">
  <div id="list" class="grid"></div>
  <div id="paginationContainer" class="pagination"></div>
</div>

<div id="modDetail" class="detail"></div>

<script>
const TMDB_KEY = "e21a85e6343d495f7e82edffc3f21d67"; 
const API_URL = "https://api.themoviedb.org/3";
const IMG_PATH = "https://image.tmdb.org/t/p/w500";

const MY_MOVIES_DATA = [
  {
    id: "my_1",
    title: "Phú Nhân Đại Quân Thế Kỷ 21",
    poster: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500", 
    videoUrl: "https://streamtape.com/e/gP6r4y4qYPiqKoo/", 
    overview: "Bộ phim tâm lý, tình cảm đặc sắc do bạn tải lên và quản lý trực tiếp trên hệ thống."
  }
];

let currentType = "popular";
let currentPage = 1;
let totalPages = 1;
let isSearching = false;
let currentQuery = "";
let isLightsOff = false;

async function fetchMovies(page = 1) {
  currentPage = page;
  
  if (currentType === "my_movies") {
    displayMovies(MY_MOVIES_DATA, true);
    document.getElementById("paginationContainer").innerHTML = "";
    return;
  }

  let url = `${API_URL}/movie/${currentType}?api_key=${TMDB_KEY}&language=vi-VN&page=${currentPage}`;
  if (isSearching) {
    url = `${API_URL}/search/movie?api_key=${TMDB_KEY}&language=vi-VN&query=${encodeURIComponent(currentQuery)}&page=${currentPage}`;
  }
  
  try {
    let res = await fetch(url);
    let data = await res.json();
    totalPages = Math.min(data.total_pages, 500); 
    displayMovies(data.results, false);
    setupPagination();
  } catch (err) {
    document.getElementById("list").innerHTML = "<p style='text-align:center; width:100%; color:#aaa; padding: 50px 0;'>Không thể kết nối máy chủ dữ liệu phim tự động.</p>";
  }
}

function displayMovies(movies, isLocal) {
  let listDiv = document.getElementById("list");
  let html = "";

  if (!movies || movies.length === 0) {
    listDiv.innerHTML = "<p style='text-align:center; width:100%; color:#aaa; grid-column: 1/-1; padding: 50px 0;'>Không tìm thấy bộ phim nào phù hợp.</p>";
    return;
  }

  movies.forEach(m => {
    if (isLocal) {
      html += `
        <div class="card" onclick="openLocalMovie('${m.id}')">
          <img src="${m.poster}" alt="${m.title}">
          <p>${m.title}</p>
        </div>
      `;
    } else {
      let posterUrl = m.poster_path ? (IMG_PATH + m.poster_path) : "https://via.placeholder.com/500x750?text=No+Image";
      html += `
        <div class="card" onclick="openApiMovie(${m.id})">
          <img src="${posterUrl}" alt="${m.title}">
          <p>${m.title}</p>
        </div>
      `;
    }
  });
  listDiv.innerHTML = html;
  window.scrollTo(0, 0); 
}

function openApiMovie(id) {
  fetch(`${API_URL}/movie/${id}?api_key=${TMDB_KEY}&language=vi-VN`)
    .then(res => res.json())
    .then(m => {
      toggleDetailView(true);
      let embedUrl = `https://vidsrc.me/embed/movie/${id}`;
      renderDetail(m.title, embedUrl, m.overview || "Đang cập nhật nội dung tóm tắt...");
    });
}

function openLocalMovie(id) {
  let m = MY_MOVIES_DATA.find(movie => movie.id === id);
  if (!m) return;
  toggleDetailView(true);
  renderDetail(m.title, m.videoUrl, m.overview);
}

function renderDetail(title, videoUrl, overview) {
  document.getElementById("modDetail").innerHTML = `
    <div class="action-bar">
      <button class="btn-back" onclick="backToList()">⬅ Quay lại</button>
      <button class="btn-light" id="lightBtn" onclick="toggleLights()">💡 Tắt Đèn</button>
    </div>
    <h2>${title}</h2>
    <div class="video-container">
      <iframe src="${videoUrl}" frameborder="0" allowfullscreen scrolling="no"></iframe>
    </div>
    <div class="movie-overview">
      <p style="margin:0; font-weight:700; color:white; margin-bottom:10px; font-size:18px;">Nội dung phim</p>
      <p style="margin:0;">${overview}</p>
    </div>
  `;
}

function toggleLights() {
  isLightsOff = !isLightsOff;
  let body = document.body;
  let overlay = document.getElementById("lightOverlay");
  let btn = document.getElementById("lightBtn");

  if (isLightsOff) {
    body.classList.add("lights-off");
    overlay.style.display = "block";
    btn.innerHTML = "🌟 Bật Đèn";
    btn.style.background = "#ffffff";
    btn.style.color = "#000000";
  } else {
    body.classList.remove("lights-off");
    overlay.style.display = "none";
    btn.innerHTML = "💡 Tắt Đèn";
    btn.style.background = "var(--glass)";
    btn.style.color = "#ffffff";
  }
}

function toggleDetailView(showDetail) {
  if (showDetail) {
    document.getElementById("mainSection").style.display = "none";
    document.getElementById("tabContainer").style.display = "none"; 
    document.getElementById("modDetail").style.display = "block";
  } else {
    if (isLightsOff) toggleLights();
    document.getElementById("modDetail").style.display = "none";
    document.getElementById("mainSection").style.display = "block";
    document.getElementById("tabContainer").style.display = "flex";
  }
}

function setupPagination() {
  let pagDiv = document.getElementById("paginationContainer");
  if (totalPages <= 1) { pagDiv.innerHTML = ""; return; }

  let html = "";
  html += `<button class="page-btn" ${currentPage === 1 ? "disabled" : ""} onclick="changePage(${currentPage - 1})">Trước</button>`;
  let startPage = Math.max(1, currentPage - 2);
  let endPage = Math.min(totalPages, currentPage + 2);

  if (startPage > 1) {
    html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
    if (startPage > 2) html += `<span style="color:#666; padding:0 5px;">...</span>`;
  }

  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i === currentPage ? "active" : ""}" onclick="changePage(${i})">${i}</button>`;
  }
  
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span style="color:#666; padding:0 5px;">...</span>`;
    html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
  }

  html += `<button class="page-btn" ${currentPage === totalPages ? "disabled" : ""} onclick="changePage(${currentPage + 1})">Sau</button>`;
  pagDiv.innerHTML = html;
}

function changePage(page) {
  if (page < 1 || page > totalPages) return;
  fetchMovies(page);
}

function switchCategory(type, element) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  element.classList.add('active');
  document.getElementById("searchInput").value = ""; 
  currentType = type;
  isSearching = false;
  backToList();
  fetchMovies(1);
}

function searchMovies() {
  let query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (query === "") return;
  
  if (currentType === "my_movies") {
    let filtered = MY_MOVIES_DATA.filter(m => m.title.toLowerCase().includes(query));
    displayMovies(filtered, true);
  } else {
    currentQuery = query;
    isSearching = true;
    backToList();
    fetchMovies(1);
  }
}

function backToList() {
  toggleDetailView(false);
  document.getElementById("modDetail").innerHTML = ""; 
}

function goHome() {
  document.getElementById("searchInput").value = "";
  switchCategory('popular', document.querySelector('.tab-btn'));
}

fetchMovies(1);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Phim Mới</title>
<style>
body { font-family: Arial; margin:0; background:#111; color:white; }
header { background:#000; padding:15px; display:flex; gap:15px; }
header a { color:white; text-decoration:none; padding:8px 12px; background:#222; border-radius:6px; }
header a:hover { background:red; }

.container { padding:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:15px; }

.movie {
 background:#222; padding:10px; border-radius:10px;
}

.movie img { width:100%; border-radius:8px; }

.title { font-size:14px; margin-top:8px; }
</style>
</head>

<body>

<header>
  <a href="index.html">Trang chủ</a>
  <a href="phim-le.html">Phim lẻ</a>
  <a href="phim-bo.html">Phim bộ</a>
</header>

<h2 style="padding:15px;">🔥 Phim mới cập nhật</h2>

<div class="container" id="movieList"></div>

<script>
// 🔥 THAY API CỦA BẠN VÀO ĐÂY
const API_URL = "https://YOUR-API-OF-YOU.com/movies";

async function loadMovies() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    const container = document.getElementById("movieList");
    container.innerHTML = "";

    data.forEach(movie => {
      container.innerHTML += `
        <div class="movie">
          <img src="${movie.image}" />
          <div class="title">${movie.title}</div>
        </div>
      `;
    });

  } catch (err) {
    console.log(err);
    document.getElementById("movieList").innerHTML =
      "Không tải được dữ liệu 😢";
  }
}

loadMovies();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Phim Lẻ</title>
</head>
<body>

<h2>Phim Lẻ</h2>
<a href="index.html">← Quay lại</a>

<div id="list"></div>

<script>
const API_URL = "https://YOUR-API-OF-YOU.com/movies?type=le";

fetch(API_URL)
.then(res => res.json())
.then(data => {
  document.getElementById("list").innerHTML =
    data.map(m => `<p>${m.title}</p>`).join("");
});
</script>

</body>
</html>
